<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteVox Harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --sunken:#efede7; --ink:#1a1d21; --ink-2:#3d444d; --muted:#5d6570;
  --line:#e2dfd6; --line-2:#cfcbc0;
  --accent:#1f47d6; --accent-ink:#ffffff; --accent-soft:#e6ebfc;
  --ok:#17794f; --ok-soft:#e2f3ea; --warn:#9a5a00; --warn-soft:#fbefd9;
  --bad:#b4232c; --bad-soft:#fbe6e6; --info:#1f47d6; --info-soft:#e6ebfc;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px; --rail:272px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101214; --surface:#171a1d; --sunken:#1d2125; --ink:#ebe9e3; --ink-2:#c3c6cb; --muted:#99a0a9;
    --line:#2a2f35; --line-2:#3a4048;
    --accent:#86a0ff; --accent-ink:#0c1020; --accent-soft:#1c2542;
    --ok:#52c796; --ok-soft:#14302a; --warn:#eeb050; --warn-soft:#352a12;
    --bad:#ff8087; --bad-soft:#3a1c1f; --info:#86a0ff; --info-soft:#1c2542;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{padding:20px 20px 14px}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rail .new{margin:0 14px 12px}
.rail h6{margin:10px 20px 6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.runs{overflow:auto;padding:0 8px 16px;flex:1}
.run{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:9px 12px;cursor:pointer;border-left:3px solid transparent}
.run:hover{background:var(--sunken)}
.run.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.run .g{display:block;font-size:13.5px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.run .m{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.complete{background:var(--ok)} .dot.partial,.dot.interrupted{background:var(--warn)}
.dot.failed,.dot.refused{background:var(--bad)} .dot.running{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.running{animation:none}.bar i{transition:none!important}}
main{padding:32px 40px 64px;max-width:1120px;width:100%}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- section scaffolding ---------- */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.sec-h h2{margin:0;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h .rule{flex:1;border-top:1px solid var(--line)}
.sec-h .hint{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:18px 20px}

/* ---------- composer ---------- */
.hero h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
.hero p{margin:0;color:var(--ink-2);max-width:62ch}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:500 12px var(--mono);color:var(--muted)}
.step h3{margin:0 0 2px;font-size:15px;font-weight:600}
.step .lead{margin:0 0 10px;color:var(--muted);font-size:13.5px}
textarea,select,input[type=number]{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px}
textarea{min-height:104px;resize:vertical;font-size:15px}
.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.ex{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.ex:hover{border-color:var(--accent)}
.ex b{display:block;font-size:13.5px;font-weight:600}
.ex span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opt{position:relative;display:block;border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){opacity:.55;cursor:not-allowed}
.opt b{display:block;font-weight:600}.opt span{display:block;color:var(--muted);font-size:13px}
details.adv{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.adv summary{cursor:pointer;padding:10px 14px;font-weight:500}
details.adv .body{padding:4px 14px 14px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.grid2 label{font-size:13px;color:var(--ink-2);display:block;margin-bottom:4px}
.grid2 small{display:block;color:var(--muted);font-size:12px;margin-top:3px}

/* ---------- run header ---------- */
.rh{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.rh h1{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.015em;font-weight:600;max-width:52ch}
.rh .meta{font:12px var(--mono);color:var(--muted);margin-top:6px}
.verdict{display:flex;gap:14px;align-items:center;margin-top:16px;padding:14px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.verdict .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict .ic svg{width:18px;height:18px}
.verdict b{display:block;font-size:16px;font-weight:600}
.verdict span{color:var(--ink-2);font-size:14px}
.verdict.complete{border-color:var(--ok);background:var(--ok-soft)} .verdict.complete .ic{background:var(--ok);color:#fff}
.verdict.partial,.verdict.interrupted{border-color:var(--warn);background:var(--warn-soft)} .verdict.partial .ic,.verdict.interrupted .ic{background:var(--warn);color:#fff}
.verdict.failed,.verdict.refused{border-color:var(--bad);background:var(--bad-soft)} .verdict.failed .ic,.verdict.refused .ic{background:var(--bad);color:#fff}
.verdict.running{border-color:var(--accent);background:var(--accent-soft)} .verdict.running .ic{background:var(--accent);color:var(--accent-ink)}
.reasons{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-2)}

/* ---------- attention (approval) ---------- */
.attn{border:2px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:16px 18px;margin-top:20px}
.attn h3{margin:0 0 4px;font-size:15px;color:var(--warn);display:flex;gap:8px;align-items:center}
.attn p{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.attn pre{margin:0 0 12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font:12.5px/1.5 var(--mono);overflow:auto;max-height:240px;white-space:pre-wrap}
.attn .btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- team pipeline ---------- */
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
@media (max-width:900px){.team{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.node{padding:14px 16px;border:1px solid var(--line);background:var(--surface);position:relative}
.node:first-child{border-radius:10px 0 0 10px}.node:last-child{border-radius:0 10px 10px 0}
.node + .node{margin-left:-1px}
@media (max-width:900px){.node,.node:first-child,.node:last-child{border-radius:10px;margin-left:0}}
.node .st{display:flex;align-items:center;gap:7px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.node.working{border-color:var(--accent);background:var(--accent-soft);z-index:1}
.node.working .st{color:var(--accent)}
.node.done .st{color:var(--ok)}
.node.paused{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}.node.paused .st{color:var(--warn)}
.node.skipped{background:var(--sunken)}.node.skipped h3,.node.skipped p{color:var(--muted)}
.node h3{margin:6px 0 2px;font-size:15px;font-weight:600}
.node p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.node .cnt{margin-top:8px;font-size:13px;color:var(--ink-2)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.sub{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;border-left:3px solid var(--line-2)}
.sub.accepted{border-left-color:var(--ok)}.sub.working,.sub.running{border-left-color:var(--accent)}
.sub.unverified,.sub.unchecked{border-left-color:var(--warn)}.sub.failed,.sub.skipped{border-left-color:var(--bad)}
.sub .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font:500 11.5px var(--mono);color:var(--muted)}
.sub .t{font-weight:600;margin:4px 0 2px;font-size:14px;line-height:1.35}
.sub .a{font-size:12.5px;color:var(--muted);min-height:18px}
.tag{display:inline-block;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunken);color:var(--ink-2)}
.tag.accepted,.tag.complete{background:var(--ok-soft);color:var(--ok)}
.tag.unverified,.tag.unchecked,.tag.partial{background:var(--warn-soft);color:var(--warn)}
.tag.failed,.tag.skipped,.tag.refused{background:var(--bad-soft);color:var(--bad)}
.tag.working,.tag.running,.tag.queued{background:var(--info-soft);color:var(--info)}

/* ---------- limits ---------- */
.limits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.limits{grid-template-columns:1fr}}
.lim{padding:14px 16px}
.lim .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lim .top span{font-size:13px;color:var(--muted)}
.lim .top b{font:500 15px var(--mono)}
.lim .top b small{color:var(--muted);font-weight:400}
.bar{height:6px;background:var(--sunken);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.bar i.hot{background:var(--bad)}
.counters{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
.counters b{color:var(--ink);font-weight:600}
.counters .alert b{color:var(--warn)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font:500 11px var(--mono);background:var(--sunken);color:var(--ink-2);padding:1px 7px;border-radius:99px}
.tab .c.hot{background:var(--warn-soft);color:var(--warn)}

/* ---------- result ---------- */
.summary{padding:18px 22px;font-size:15.5px;line-height:1.65}
.summary h4{margin:0 0 6px;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.finding{display:grid;grid-template-columns:56px minmax(0,1fr);border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;margin-top:10px}
.finding .rk{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px;gap:6px;border-right:1px solid var(--line);background:var(--sunken)}
.finding .rk b{font:500 15px var(--mono)}
.sev{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.chip{font:500 11.5px var(--mono);padding:2px 9px;border-radius:99px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.chip.good{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.evsrc{padding:4px 10px;font:12px var(--mono);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.evsrc a{color:var(--accent)}
.sev.info{background:var(--info-soft);color:var(--info)}
.sev.high{background:var(--bad-soft);color:var(--bad)}.sev.medium{background:var(--warn-soft);color:var(--warn)}.sev.low{background:var(--sunken);color:var(--ink-2);border:1px solid var(--line-2)}
.finding .bd{padding:14px 18px}
.finding h3{margin:0 0 4px;font-size:15.5px;font-weight:600;line-height:1.35}
.finding p{margin:0 0 10px;color:var(--ink-2);font-size:14.5px}
.ev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.ev .evh{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;background:var(--sunken);font:12px var(--mono);color:var(--ink-2);border-bottom:1px solid var(--line)}
.ev .evh .v{color:var(--ok);display:flex;gap:5px;align-items:center}.ev .evh .v.no{color:var(--bad)}
.ev code{display:block;padding:8px 12px;font:12.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface)}
.notice{display:flex;gap:8px;align-items:center;margin-top:10px;padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- activity ---------- */
.tools{display:flex;gap:14px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.log{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row{display:grid;grid-template-columns:58px 132px minmax(0,1fr);gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);border-left:3px solid transparent;font-size:13.5px}
.row:last-child{border-bottom:0}
.row.bad{border-left-color:var(--bad);background:var(--bad-soft)}.row.warn{border-left-color:var(--warn);background:var(--warn-soft)}.row.good{border-left-color:var(--ok)}
.row .tm{font:12px var(--mono);color:var(--muted);padding-top:1px}
.row .who{font:500 12px var(--mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;background:var(--muted)}
.r-researcher i{background:#0891b2}.r-ingest i{background:#64748b}.r-planner i{background:#8b5cf6}.r-worker i{background:#2f6bff}.r-editor i{background:#d98a00}.r-checker i{background:#0f9d76}.r-assembler i{background:#d6338a}
.row .tx{min-width:0;overflow-wrap:anywhere}
.row .tx .mu{color:var(--muted)}
.row .more{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 0 0 8px;font-size:12.5px}
.row pre{margin:8px 0 2px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:340px;font:12px/1.5 var(--mono);white-space:pre-wrap}

/* ---------- safety ---------- */
.sg{display:grid;gap:10px}
.sf{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sf .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2)}
.sf.bad .ic{background:var(--bad-soft);color:var(--bad)}.sf.warn .ic{background:var(--warn-soft);color:var(--warn)}.sf.good .ic{background:var(--ok-soft);color:var(--ok)}
.sf b{display:block;font-size:14.5px;font-weight:600}
.sf p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.sf .by{margin-top:6px;font:12px var(--mono);color:var(--muted)}
.diff{font:12.5px/1.55 var(--mono);white-space:pre;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 0}
.diff div{padding:0 14px}.diff .add{background:var(--ok-soft);color:var(--ok)}.diff .del{background:var(--bad-soft);color:var(--bad)}.diff .hd{color:var(--muted)}

.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r);max-width:420px;z-index:30;font-size:14px}
.loading{color:var(--muted);padding:30px}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .runs{max-height:180px}
  main{padding:20px 16px 48px}
  .row{grid-template-columns:48px minmax(0,1fr)}
  .row .who{grid-column:2;order:2;font-size:11px}
  .row .tx{grid-column:1 / -1;order:3}
  .finding{grid-template-columns:44px minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Runs">
    <div class="brand"><b>ByteVox Harness</b><span>A team of AI agents with limits, checks and a full record.</span></div>
    <button class="btn primary new" id="newBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New run</button>
    <h6>Your runs</h6>
    <div class="runs" id="runs"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
"use strict";
/* =================================================================== helpers */
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? (k.startsWith('aria-') ? 'true' : '') : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;

function renderSafety(body) {
  const list = safetyEvents();
  body.append(el('p', { style: 'margin:0 0 14px;color:var(--ink-2);max-width:70ch', text: 'Everything the harness did to stay safe and reliable during this run: blocked actions, spotted attacks, failures it recovered from, and checks that sent work back.' }));
  if (!list.length) { body.append(el('div', { class: 'card empty', text: 'Nothing went wrong and nothing needed blocking in this run.' })); return; }
  body.append(el('div', { class: 'sg' }, list.map(safetyCard)));
}

/* ---- file changes */
async function renderChanges(body) {
  if (replaying || V.active) { body.append(el('div', { class: 'card empty', text: 'Shown when the run finishes.' })); return; }
  if (diffText == null) { try { diffText = await api(`/api/runs/${cur}/diff`); } catch (e) { diffText = ''; } }
  if (tab !== 'changes') return;
  if (!diffText) { body.append(el('div', { class: 'card empty' }, 'No files were changed. Agents only ever edit a private copy, and only after you approve, so your original folder is never touched.')); return; }
  body.append(el('p', { style: 'margin:0 0 12px;color:var(--ink-2)', text: 'These are the approved changes, applied to the run\'s private copy. Your original files are untouched.' }));
  const d = el('div', { class: 'diff' }); diffText.split('\n').forEach(l => d.append(el('div', { class: l.startsWith('+++') || l.startsWith('---') || l.startsWith('@@') ? 'hd' : l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : '', text: l || ' ' }))); body.append(d);
}

init().catch(e => toast('Cannot reach the server: ' + e.message));
</script>
</body>
</html>
